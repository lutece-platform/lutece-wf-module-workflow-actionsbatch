# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
workflow-actionsbatch.pageTitle=workflow-actionsbatch
workflow-actionsbatch.pagePathLabel=workflow-actionsbatch

# Pause time between each action in MS (default -1 : disabled)
workflow-actionsbatch.pause.ms=-1

# Actions batch task type
workflow-actionsbatch.actionsBatchTaskType.key=taskActionsBatch
workflow-actionsbatch.actionsBatchTaskType.titleI18nKey=module.workflow.actionsbatch.title
workflow-actionsbatch.actionsBatchTaskType.beanName=workflow-actionsbatch.actionsBatchTask
workflow-actionsbatch.actionsBatchTaskType.configBeanName=workflow-actionsbatch.actionsBatchTaskConfig
workflow-actionsbatch.actionsBatchTaskType.configRequired=true
workflow-actionsbatch.actionsBatchTaskType.formTaskRequired=false
workflow-actionsbatch.actionsBatchTaskType.taskForAutomaticAction=false
